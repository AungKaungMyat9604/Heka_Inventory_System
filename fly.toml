# fly.toml app configuration file generated for heka-inventory-system on 2026-05-12T05:27:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heka-inventory-system'
primary_region = 'sin'

[build]

[deploy]
  release_command = 'pnpm run db:seed'

[http_service]
  internal_port = 5173
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
