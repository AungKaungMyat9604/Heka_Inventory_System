# fly.toml app configuration file generated for heka on 2026-01-30T13:10:10+06:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heka-inventory'
primary_region = 'sin'

[build]

[deploy]
  # db:seed already runs db:push first; needs DATABASE_URL (+ optional DATABASE_URL_MIGRATE for Neon direct)
  release_command = "pnpm run db:seed"

[http_service]
  internal_port = 5173
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
